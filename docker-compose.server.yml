# One-file server setup: PostgreSQL + the backend API + Caddy (free Let's Encrypt HTTPS).
# For a Linux server with Docker where this repository was cloned with git.
#
# The easy way is `bash server.sh <api-domain> <git-repo-url>`, which writes server.env (the API
# domain and a generated database password), checks backend/.env and runs:
#
#   docker compose --env-file server.env -f docker-compose.server.yml up -d --build
#
# Caddy gets and renews the certificate for API_DOMAIN by itself; the domain's A record must
# point to this server and ports 80 and 443 must be open. Full steps: docs/DEPLOY.md.
name: frameforge

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: avatar
      POSTGRES_USER: avatar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in server.env}
    command: postgres -c shared_buffers=128MB -c max_connections=40
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Not published: only the backend reaches the database.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avatar -d avatar"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://avatar:${POSTGRES_PASSWORD}@db:5432/avatar
      AVATAR_DATA_DIR: /data
    volumes:
      - media:/data
    # The API listens on 8000. It is published on this machine only (for `curl` checks); the
    # internet reaches it through Caddy on 443, so passwords and cookies are always encrypted.
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in server.env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  pgdata:
  media:
  caddy_data:
  caddy_config:
