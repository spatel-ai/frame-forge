[project]
name = "avatar-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fal-client>=1.0.3",
    "fastapi>=0.163.1",
    "httpx>=0.28.1",
    "pillow>=13.0.0",
    "python-multipart>=0.0.34",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
