[project]
name = "avatar-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "fal-client>=1.0.3",
    "fastapi>=0.163.1",
    "httpx>=0.28.1",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.3.9",
    "python-multipart>=0.0.34",
    "sqlalchemy>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
# E/F pycodestyle and pyflakes, I import sorting, B bugbear
select = ["E", "F", "I", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's parameter markers are meant to be called in argument defaults.
extend-immutable-calls = ["fastapi.File", "fastapi.Form", "fastapi.Query"]

[tool.mypy]
python_version = "3.13"
# Application code only. The tests are untyped by design (fixtures and fakes); checking their
# bodies yields noise, not findings.
files = ["app"]
warn_unused_ignores = true
