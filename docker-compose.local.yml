# Local trial of the production stack on http://localhost, mock mode, no secrets, no backend/.env.
#   docker compose --env-file deploy/local.env -f docker-compose.prod.yml -f docker-compose.local.yml up --build
# Uses host port 80 only. Everything here is local-only and not a secret.
services:
  db:
    environment:
      POSTGRES_PASSWORD: local_only_password
  backend:
    env_file: !reset []
    environment:
      DATABASE_URL: postgresql+psycopg://avatar:local_only_password@db:5432/avatar
      AVATAR_DATA_DIR: /data
      AVATAR_ENV: development
      AVATAR_PROVIDER: mock
      AVATAR_PAYMENTS: mock
      AVATAR_APP_URL: http://localhost
      AVATAR_ALLOWED_ORIGINS: http://localhost,http://127.0.0.1
  web:
    environment:
      AVATAR_DOMAIN: ":80"
    ports: !override
      - "80:80"
