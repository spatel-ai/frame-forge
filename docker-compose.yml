# Local development database. These credentials are for local use only, not secrets.
# A fixed project name, so the container and its data volume are the same from
# any checkout or git worktree of this repository.
name: avatar

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: avatar
      POSTGRES_USER: avatar
      POSTGRES_PASSWORD: avatar_dev
    ports:
      - "5432:5432"
    volumes:
      - avatar_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avatar -d avatar"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  avatar_pgdata:
