<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>My scripts</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@700&display=swap">
<style>
body{margin:0}
a{color:#3626D9}a:hover{color:#14182B}
</style>
</helmet>
<div style="min-height: 100vh; display: flex; flex-wrap: wrap; background: #F4F5FA; color: #14182B; font-family: Inter, system-ui, sans-serif; font-size: 15px; line-height: 1.5">
<nav aria-label="Main" style="flex: 1 1 232px; max-width: 100%; box-sizing: border-box; background: #FFFFFF; border-right: 1px solid #DFE2EC; padding: 24px 16px; display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; align-items: center; gap: 10px; padding: 0 12px 20px">
<span style="width: 32px; height: 32px; border-radius: 10px; background: #4A3AFF; display: flex; align-items: center; justify-content: center; color: #FFFFFF"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5l12 7-12 7z"/></svg></span>
<span style="font-family: 'Plus Jakarta Sans', Inter, sans-serif; font-weight: 700; font-size: 18px">Frameforge</span>
</div>
<a href="Main.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; box-sizing: border-box; padding: 10px 12px; border-radius: 8px; color: #4B5169; font-weight: 500; text-decoration: none"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</a>
<a href="Create-1-Details.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; box-sizing: border-box; padding: 10px 12px; border-radius: 8px; color: #4B5169; font-weight: 500; text-decoration: none"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>Create</a>
<a href="Videos.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; box-sizing: border-box; padding: 10px 12px; border-radius: 8px; color: #4B5169; font-weight: 500; text-decoration: none"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 9l5 3-5 3z"/></svg>Videos</a>
<a href="Scripts.dc.html" aria-current="page" style="display: flex; align-items: center; gap: 12px; min-height: 44px; box-sizing: border-box; padding: 10px 12px; border-radius: 8px; background: #EEECFF; color: #3626D9; font-weight: 600; text-decoration: none"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z"/><path d="M9 12h7M9 16h7"/></svg>Scripts</a>
<a href="Wallet.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; box-sizing: border-box; padding: 10px 12px; border-radius: 8px; color: #4B5169; font-weight: 500; text-decoration: none"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M16 12.5h2"/></svg>Wallet</a>
<a href="Account.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; box-sizing: border-box; padding: 10px 12px; border-radius: 8px; color: #4B5169; font-weight: 500; text-decoration: none; margin-top: auto"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Account</a>
</nav>
<div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">
<header style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; padding: 20px 32px; background: #FFFFFF; border-bottom: 1px solid #DFE2EC">
<h1 style="margin: 0; font-family: 'Plus Jakarta Sans', Inter, sans-serif; font-weight: 700; font-size: 28px; line-height: 1.2">My scripts</h1>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
<span style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; box-sizing: border-box; padding: 8px 16px; border: 1px solid #DFE2EC; border-radius: 999px; font-weight: 600; font-variant-numeric: tabular-nums"><span aria-hidden="true" style="width: 14px; height: 14px; box-sizing: border-box; border-radius: 50%; background: #FFB020; border: 2px solid #9A5B00"></span>500 credits</span>
<a href="Buy-Credits.dc.html" style="display: inline-flex; align-items: center; min-height: 44px; box-sizing: border-box; padding: 8px 16px; border: 1px solid #4A3AFF; border-radius: 8px; color: #3626D9; font-weight: 600; text-decoration: none">Buy credits</a>
</div>
</header>
<main style="padding: 32px; display: flex; flex-direction: column; gap: 24px; max-width: 1120px; width: 100%; box-sizing: border-box">
<p style="margin: 0; color: #4B5169; max-width: 64ch">Every script you use is saved here automatically. Deleting a script never changes a video you already made.</p>
<div style="display: flex; flex-wrap: wrap; align-items: flex-end; gap: 16px">
<div style="flex: 1 1 280px; max-width: 420px; display: flex; flex-direction: column; gap: 6px">
<label for="search" style="font-weight: 600">Search scripts</label>
<input id="search" type="search" style="min-height: 44px; box-sizing: border-box; width: 100%; padding: 8px 12px; border: 1px solid #8A90A8; border-radius: 8px; background: #FFFFFF; color: #14182B; font: inherit">
</div>
<div style="display: flex; flex-direction: column; gap: 6px; min-width: 180px">
<label for="language" style="font-weight: 600">Language</label>
<select id="language" style="min-height: 44px; padding: 8px 12px; border: 1px solid #8A90A8; border-radius: 8px; background: #FFFFFF; color: #14182B; font: inherit">
<option>All</option>
<option>English</option>
<option>Hindi</option>
<option>Punjabi</option>
</select>
</div>
</div>
<section aria-label="Your scripts" style="border: 1px solid #DFE2EC; border-radius: 12px; overflow: hidden; background: #DFE2EC; display: flex; flex-direction: column; gap: 1px">
<sc-for list="{{scripts}}" as="s" hint-placeholder-count="5">
<div style="background: #FFFFFF; padding: 20px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 16px 24px">
<div style="flex: 1 1 360px; min-width: 0; display: flex; flex-direction: column; gap: 8px">
<p lang="{{s.lang}}" style="margin: 0; font-weight: 500; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden">{{s.text}}</p>
<span style="color: #4B5169; font-size: 13px">{{s.meta}}</span>
</div>
<span style="display: inline-flex; align-items: center; padding: 4px 12px; border-radius: 999px; background: #F4F5FA; border: 1px solid #DFE2EC; color: #4B5169; font-weight: 600; font-size: 13px">{{s.language}}</span>
<div style="display: flex; align-items: center; gap: 12px">
<a href="Create-1-Details.dc.html" style="display: inline-flex; align-items: center; min-height: 44px; box-sizing: border-box; padding: 8px 16px; border: 1px solid #4A3AFF; border-radius: 8px; color: #3626D9; font-weight: 600; text-decoration: none">Use this script</a>
<button type="button" aria-label="Delete script" style="width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid #DFE2EC; border-radius: 8px; background: #FFFFFF; color: #4B5169; cursor: pointer"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
</div>
</div>
</sc-for>
</section>
</main>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
renderVals() {
return { scripts: [
{ lang: 'en', language: 'English', text: 'Welcome to our Diwali offer, starting this Friday. Every order above five hundred rupees gets free delivery and a surprise gift. Visit us in store or order online today.', meta: 'English · 171 characters · Last used yesterday' },
{ lang: 'hi', language: 'Hindi', text: 'इस हफ्ते सभी ऑर्डर पर मुफ्त डिलीवरी। हमारी दुकान पर आइए या आज ही ऑनलाइन ऑर्डर कीजिए। हर ख़रीद पर एक छोटा सा तोहफ़ा भी मिलेगा।', meta: 'Hindi · 118 characters · Last used 12 Nov' },
{ lang: 'en', language: 'English', text: 'Namaste! Our new store opens on MG Road this Saturday at ten in the morning. Come and meet us, and bring your family.', meta: 'English · 117 characters · Last used 10 Nov' },
{ lang: 'pa', language: 'Punjabi', text: 'ਸਾਡੀ ਦੁਕਾਨ ਵਿੱਚ ਦੀਵਾਲੀ ਦੀ ਸੇਲ ਸ਼ੁਰੂ ਹੋ ਗਈ ਹੈ। ਹਰ ਖਰੀਦ ਉੱਤੇ ਇੱਕ ਤੋਹਫ਼ਾ ਮੁਫ਼ਤ ਮਿਲੇਗਾ। ਅੱਜ ਹੀ ਸਾਡੀ ਦੁਕਾਨ ਉੱਤੇ ਆਓ।', meta: 'Punjabi · 103 characters · Last used 5 Nov' },
{ lang: 'en', language: 'English', text: 'Thank you for 1,000 happy customers. To say thanks, every order this week comes with a free box of sweets.', meta: 'English · 106 characters · Last used 9 Nov' }
] };
}
}
</script>
</body>
</html>
