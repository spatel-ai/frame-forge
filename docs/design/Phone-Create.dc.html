<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Create on phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@700&display=swap">
<style>
body{margin:0}
a{color:#3626D9}a:hover{color:#14182B}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; display: flex; flex-direction: column; background: #F4F5FA; color: #14182B; font-family: Inter, system-ui, sans-serif; font-size: 15px; line-height: 1.5">
<header style="flex: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 16px; min-height: 64px; box-sizing: border-box; background: #FFFFFF; border-bottom: 1px solid #DFE2EC">
<h1 style="margin: 0; font-family: 'Plus Jakarta Sans', Inter, sans-serif; font-weight: 700; font-size: 20px; line-height: 1.2">Create a video</h1>
<span style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; box-sizing: border-box; padding: 8px 16px; border: 1px solid #DFE2EC; border-radius: 999px; font-weight: 600; font-variant-numeric: tabular-nums"><span aria-hidden="true" style="width: 14px; height: 14px; box-sizing: border-box; border-radius: 50%; background: #FFB020; border: 2px solid #9A5B00"></span>500 credits</span>
</header>
<main style="flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-weight: 600">Step 1 of 4 · Photo and script</span>
<div role="progressbar" aria-label="Create steps" aria-valuemin="0" aria-valuemax="4" aria-valuenow="1" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px">
<span style="display: block; height: 6px; border-radius: 999px; background: #4A3AFF"></span>
<span style="display: block; height: 6px; border-radius: 999px; background: #DFE2EC"></span>
<span style="display: block; height: 6px; border-radius: 999px; background: #DFE2EC"></span>
<span style="display: block; height: 6px; border-radius: 999px; background: #DFE2EC"></span>
</div>
</div>
<section aria-labelledby="h-photo" style="display: flex; flex-direction: column; gap: 8px">
<h2 id="h-photo" style="margin: 0; font-size: 15px; font-weight: 600">Photo</h2>
<div style="border: 2px dashed #8A90A8; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; background: #FFFFFF">
<span role="img" aria-label="Preview of the chosen photo" style="width: 72px; height: 72px; border-radius: 10px; background: #D9DCEB; display: flex; align-items: center; justify-content: center; color: #4B5169"><svg aria-hidden="true" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="9" r="4"/><path d="M5 21a7 7 0 0 1 14 0"/></svg></span>
<span style="font-weight: 600; overflow-wrap: anywhere">asha-portrait.jpg</span>
<span style="display: inline-flex; align-items: center; gap: 6px; color: #0B7A55; font-size: 13px; font-weight: 600"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>Looks good · 1.8 MB</span>
<button type="button" style="min-height: 44px; padding: 8px 14px; border: 1px solid #DFE2EC; border-radius: 8px; background: #FFFFFF; color: #14182B; font: inherit; font-weight: 600; cursor: pointer">Change photo</button>
</div>
</section>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="language" style="font-weight: 600">Language</label>
<select id="language" style="min-height: 44px; padding: 8px 12px; border: 1px solid #8A90A8; border-radius: 8px; background: #FFFFFF; color: #14182B; font: inherit">
<option>English</option>
<option>Hindi</option>
<option>Punjabi</option>
</select>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="script" style="font-weight: 600">What should the person say?</label>
<textarea id="script" rows="4" style="padding: 12px; border: 1px solid #8A90A8; border-radius: 8px; background: #FFFFFF; color: #14182B; font: inherit; resize: vertical; box-sizing: border-box; width: 100%">Welcome to our Diwali offer, starting this Friday. Every order above five hundred rupees gets free delivery and a surprise gift. Visit us in store or order online today.</textarea>
<div style="display: flex; justify-content: flex-end; color: #4B5169; font-size: 13px; font-variant-numeric: tabular-nums">171 / 400</div>
</div>
</main>
<div style="flex: none; background: #FFFFFF; border-top: 1px solid #DFE2EC; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px">
<span style="color: #4B5169">Estimated price <strong style="color: #14182B">[PRICE] credits</strong></span>
<a href="Phone-Create.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; box-sizing: border-box; padding: 12px 24px; border-radius: 8px; background: #4A3AFF; color: #FFFFFF; font-weight: 600; font-size: 16px; text-decoration: none">Continue<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
</div>
<nav aria-label="Main" style="flex: none; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: #FFFFFF; border-top: 1px solid #DFE2EC">
<a href="Phone-Home.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 56px; box-sizing: border-box; padding: 6px 4px; color: #4B5169; font-size: 12px; font-weight: 500; text-decoration: none"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</a>
<a href="Phone-Create.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 56px; box-sizing: border-box; padding: 6px 4px; color: #3626D9; font-size: 12px; font-weight: 600; text-decoration: none"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>Create</a>
<a href="Videos.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 56px; box-sizing: border-box; padding: 6px 4px; color: #4B5169; font-size: 12px; font-weight: 500; text-decoration: none"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 9l5 3-5 3z"/></svg>Videos</a>
<a href="Phone-Wallet.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 56px; box-sizing: border-box; padding: 6px 4px; color: #4B5169; font-size: 12px; font-weight: 500; text-decoration: none"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M16 12.5h2"/></svg>Wallet</a>
<a href="Account.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 56px; box-sizing: border-box; padding: 6px 4px; color: #4B5169; font-size: 12px; font-weight: 500; text-decoration: none"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>More</a>
</nav>
</div>
