<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Create your account</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@700&display=swap">
<style>
body{margin:0}
a{color:#3626D9}a:hover{color:#14182B}
</style>
</helmet>
<div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; padding: 32px 16px; box-sizing: border-box; background: #F4F5FA; color: #14182B; font-family: Inter, system-ui, sans-serif; font-size: 15px; line-height: 1.5">
<div style="display: flex; align-items: center; gap: 10px">
<span style="width: 32px; height: 32px; border-radius: 10px; background: #4A3AFF; display: flex; align-items: center; justify-content: center; color: #FFFFFF"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5l12 7-12 7z"/></svg></span>
<span style="font-family: 'Plus Jakarta Sans', Inter, sans-serif; font-weight: 700; font-size: 18px">Talking Avatar</span>
</div>
<main style="max-width: 420px; width: 100%; box-sizing: border-box; padding: 32px; background: #FFFFFF; border: 1px solid #DFE2EC; border-radius: 16px; display: flex; flex-direction: column; gap: 16px">
<h1 style="margin: 0; font-family: 'Plus Jakarta Sans', Inter, sans-serif; font-weight: 700; font-size: 28px; line-height: 1.2">Create your account</h1>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="name" style="font-weight: 600">Name</label>
<input id="name" type="text" value="Asha Verma" autocomplete="name" style="min-height: 44px; box-sizing: border-box; width: 100%; padding: 8px 12px; border: 1px solid #8A90A8; border-radius: 8px; background: #FFFFFF; color: #14182B; font: inherit">
<span style="display: inline-flex; align-items: center; gap: 6px; color: #0B7A55; font-size: 13px; font-weight: 600"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>Looks good</span>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="email" style="font-weight: 600">Email</label>
<input id="email" type="email" value="asha@example" autocomplete="email" aria-invalid="true" aria-describedby="email-error" style="min-height: 44px; box-sizing: border-box; width: 100%; padding: 8px 12px; border: 2px solid #C7322F; border-radius: 8px; background: #FFFFFF; color: #14182B; font: inherit">
<span id="email-error" role="alert" style="display: flex; align-items: flex-start; gap: 6px; color: #C7322F; font-size: 13px; font-weight: 600"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex: none; margin-top: 2px"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5v.5"/></svg>Enter a full email address, like name@example.com.</span>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="password" style="font-weight: 600">Password</label>
<input id="password" type="password" value="Diwali2026!" autocomplete="new-password" aria-describedby="password-rules" style="min-height: 44px; box-sizing: border-box; width: 100%; padding: 8px 12px; border: 1px solid #8A90A8; border-radius: 8px; background: #FFFFFF; color: #14182B; font: inherit">
<ul id="password-rules" style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px">
<li style="display: flex; align-items: center; gap: 6px; color: #0B7A55; font-size: 13px; font-weight: 600"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>At least 10 characters<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap"> (met)</span></li>
</ul>
</div>
<div style="display: flex; align-items: flex-start; gap: 12px; min-height: 44px">
<input id="terms" type="checkbox" style="flex: none; width: 24px; height: 24px; margin: 10px 0 0; accent-color: #4A3AFF">
<label for="terms" style="padding-top: 10px">I agree to the <a href="#" style="font-weight: 600">Terms</a> and the <a href="#" style="font-weight: 600">Privacy Policy</a></label>
</div>
<a href="Main.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 48px; box-sizing: border-box; padding: 12px 24px; border-radius: 8px; background: #4A3AFF; color: #FFFFFF; font-weight: 600; font-size: 16px; text-decoration: none">Create account</a>
<p style="margin: 0; text-align: center; color: #4B5169">Already have an account? <a href="Login.dc.html" style="font-weight: 600">Log in</a></p>
</main>
<p style="margin: 0; color: #4B5169; font-size: 13px; text-align: center">We will email you a link to confirm your address.</p>
</div>
</x-dc>

</body>
</html>
