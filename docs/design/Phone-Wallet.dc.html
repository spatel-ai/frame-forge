<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wallet on phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@700&display=swap">
<style>
body{margin:0}
a{color:#3626D9}a:hover{color:#14182B}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; display: flex; flex-direction: column; background: #F4F5FA; color: #14182B; font-family: Inter, system-ui, sans-serif; font-size: 15px; line-height: 1.5">
<header style="flex: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 16px; min-height: 64px; box-sizing: border-box; background: #FFFFFF; border-bottom: 1px solid #DFE2EC">
<h1 style="margin: 0; font-family: 'Plus Jakarta Sans', Inter, sans-serif; font-weight: 700; font-size: 20px; line-height: 1.2">Wallet</h1>
<span style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; box-sizing: border-box; padding: 8px 16px; border: 1px solid #DFE2EC; border-radius: 999px; font-weight: 600; font-variant-numeric: tabular-nums"><span aria-hidden="true" style="width: 14px; height: 14px; box-sizing: border-box; border-radius: 50%; background: #FFB020; border: 2px solid #9A5B00"></span>500 credits</span>
</header>
<main style="flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 24px">
<section aria-label="Balance" style="background: #FFFFFF; border: 1px solid #DFE2EC; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 12px">
<span style="color: #4B5169">Your balance</span>
<span style="display: flex; align-items: center; gap: 12px; font-family: 'Plus Jakarta Sans', Inter, sans-serif; font-weight: 700; font-size: 32px; line-height: 1.2; font-variant-numeric: tabular-nums"><span aria-hidden="true" style="width: 28px; height: 28px; box-sizing: border-box; border-radius: 50%; background: #FFB020; border: 3px solid #9A5B00"></span>500 credits</span>
<span style="color: #4B5169; font-variant-numeric: tabular-nums">40 on hold · 460 available</span>
<a href="Buy-Credits.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 48px; box-sizing: border-box; padding: 12px 24px; border-radius: 8px; background: #4A3AFF; color: #FFFFFF; font-weight: 600; font-size: 16px; text-decoration: none">Buy credits</a>
</section>
<section aria-labelledby="h-tx" style="display: flex; flex-direction: column; gap: 12px">
<h2 id="h-tx" style="margin: 0; font-family: 'Plus Jakarta Sans', Inter, sans-serif; font-weight: 700; font-size: 20px">Transactions</h2>
<ul style="list-style: none; margin: 0; padding: 0 16px; background: #FFFFFF; border: 1px solid #DFE2EC; border-radius: 12px">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
<li style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; padding: 14px 0; border-bottom: 1px solid #DFE2EC">
<span style="min-width: 0; display: flex; flex-direction: column">
<span style="font-weight: 600">{{r.desc}}</span>
<span style="color: #4B5169; font-size: 13px">{{r.date}}</span>
</span>
<span style="flex: none; font-weight: 600; font-variant-numeric: tabular-nums">{{r.amount}}</span>
</li>
</sc-for>
</ul>
</section>
</main>
<nav aria-label="Main" style="flex: none; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: #FFFFFF; border-top: 1px solid #DFE2EC">
<a href="Phone-Home.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 56px; box-sizing: border-box; padding: 6px 4px; color: #4B5169; font-size: 12px; font-weight: 500; text-decoration: none"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</a>
<a href="Phone-Create.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 56px; box-sizing: border-box; padding: 6px 4px; color: #4B5169; font-size: 12px; font-weight: 500; text-decoration: none"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>Create</a>
<a href="Videos.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 56px; box-sizing: border-box; padding: 6px 4px; color: #4B5169; font-size: 12px; font-weight: 500; text-decoration: none"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 9l5 3-5 3z"/></svg>Videos</a>
<a href="Phone-Wallet.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 56px; box-sizing: border-box; padding: 6px 4px; color: #3626D9; font-size: 12px; font-weight: 600; text-decoration: none"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M16 12.5h2"/></svg>Wallet</a>
<a href="Account.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 56px; box-sizing: border-box; padding: 6px 4px; color: #4B5169; font-size: 12px; font-weight: 500; text-decoration: none"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>More</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { rows: [
{ desc: 'Credits bought', date: '12 Nov · UPI', amount: '+500' },
{ desc: 'Video: Namaste! Our new store…', date: 'Today', amount: 'On hold' },
{ desc: 'Video: Thank you for 1,000…', date: '9 Nov', amount: '−240' },
{ desc: 'Video could not be made', date: '8 Nov', amount: 'Returned' }
] };
}
}
</script>
</body>
</html>
