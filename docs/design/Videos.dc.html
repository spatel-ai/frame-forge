<h1 style="margin: 0; font-family: 'Plus Jakarta Sans', Inter, sans-serif; font-weight: 700; font-size: 28px; line-height: 1.2">Videos</h1>

<div style="flex: 1 1 280px; max-width: 420px; display: flex; flex-direction: column; gap: 6px">
<label for="search" style="font-weight: 600">Search videos</label>
<input id="search" type="search" style="min-height: 44px; box-sizing: border-box; width: 100%; padding: 8px 12px; border: 1px solid #8A90A8; border-radius: 8px; background: #FFFFFF; color: #14182B; font: inherit">
</div>
<div style="display: flex; flex-direction: column; gap: 6px; min-width: 180px">
<label for="status" style="font-weight: 600">Status</label>

<option>All</option>
<option>Ready</option>
<option>In progress</option>
<option>Failed</option>
</select>
</div>
<a href="Create-1-Details.dc.html" style="margin-left: auto; display: inline-flex; align-items: center; gap: 8px; min-height: 48px; box-sizing: border-box; padding: 12px 24px; border-radius: 8px; background: #4A3AFF; color: #FFFFFF; font-weight: 600; font-size: 16px; text-decoration: none"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Create a video</a>
</div>
<section aria-label="Your videos" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px">
<sc-for list="{{videos}}" as="v" hint-placeholder-count="6">
<a href="{{v.href}}" style="background: #FFFFFF; border: 1px solid #DFE2EC; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; color: #14182B; text-decoration: none">
<span aria-hidden="true" style="aspect-ratio: 16 / 9; background: #E6E8F2; display: flex; align-items: center; justify-content: center; color: #4B5169; position: relative"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="10"/><path d="M10 8l6 4-6 4z" fill="currentColor"/></svg><span style="position: absolute; right: 8px; bottom: 8px; padding: 2px 8px; border-radius: 6px; background: #14182B; color: #FFFFFF; font-size: 12px; font-variant-numeric: tabular-nums">{{v.length}}</span></span>
<span style="padding: 16px; display: flex; flex-direction: column; gap: 8px">
<span style="font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{v.title}}</span>
<span style="color: #4B5169; font-size: 13px">{{v.meta}}</span>
<span style="{{v.pillStyle}}"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="{{v.icon}}"/></svg>{{v.status}}</span>
</span>
</a>
</sc-for>
</section>
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
<span style="color: #4B5169">Showing 6 of 14</span>
<div style="display: flex; gap: 12px">
<button type="button" disabled style="min-height: 44px; padding: 8px 16px; border: 1px solid #DFE2EC; border-radius: 8px; background: #F4F5FA; color: #666C85; font: inherit; font-weight: 600; cursor: not-allowed">Previous</button>
<button type="button" style="min-height: 44px; padding: 8px 16px; border: 1px solid #DFE2EC; border-radius: 8px; background: #FFFFFF; color: #14182B; font: inherit; font-weight: 600; cursor: pointer">Next</button>
</div>
</div>
</main>
