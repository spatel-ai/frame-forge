# Production stack: PostgreSQL, the API and Caddy (web app + HTTPS). See docs/DEPLOY.md.
# Run: docker compose --env-file deploy/prod.env -f docker-compose.prod.yml up -d --build
# Local trial in mock mode: add  -f docker-compose.local.yml  and drop --env-file.
name: frameforge-prod

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: avatar
      POSTGRES_USER: avatar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/prod.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No published ports: only the backend reaches the database, over the compose network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avatar -d avatar"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://avatar:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/avatar
      AVATAR_DATA_DIR: /data
    volumes:
      - media:/data
    depends_on:
      db:
        condition: service_healthy
    # Not published: Caddy reaches it as backend:8000.

  web:
    build:
      context: ./frontend
      additional_contexts:
        deploy: ./deploy
    restart: unless-stopped
    environment:
      AVATAR_DOMAIN: ${AVATAR_DOMAIN:?set AVATAR_DOMAIN in deploy/prod.env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  pgdata:
  media:
  caddy_data:
  caddy_config:
